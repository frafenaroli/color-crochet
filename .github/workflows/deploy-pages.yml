name: Deploy to GitHub Pages

# Pubblica la webapp statica su GitHub Pages.
# Gira sul branch di sviluppo (non tocca main) e attiva Pages automaticamente.

on:
  push:
    branches:
      - claude/project-startup-web-xjh874
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages (attiva se non gia' attivo)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy su Pages
        id: deployment
        uses: actions/deploy-pages@v4
